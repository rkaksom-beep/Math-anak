      <rect x="108" y="118" width="92" height="92" rx="12" fill="#FFF"/>
      <rect x="216" y="118" width="92" height="92" rx="12" fill="#FFF"/>
    </g>
  </g>
  <g transform="translate(18,560)"><rect x="0" y="0" width="354" height="128" rx="16" fill="transparent"/><g transform="translate(234,12)"><rect width="120" height="64" rx="14" class="btn"/><text x="60" y="40" class="btn-txt" text-anchor="middle">Hint</text></g></g>
